services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    environment:
      HOST: 0.0.0.0
      REACT_INTELLIGENCE_DB: /data/react-intelligence.sqlite
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "${RI_API_BIND:-127.0.0.1}:4000:4000"
    volumes:
      - react-intelligence-data:/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_URL: ""
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${RI_DASHBOARD_BIND:-127.0.0.1}:5178:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["ai"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  react-intelligence-data:
  ollama-data:
